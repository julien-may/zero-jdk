project:
  name: myapp
  version: 1.0.0
  description: Native CLI built with GraalVM
  authors:
    - Julien May
  license: Apache-2.0
  copyright: Julien - 2025
  links:
    homepage: https://julien-may.github.io/zero-jdk/
    documentation: https://julien-may.github.io/zero-jdk/

assemble:
  archive:
    zjdk:
      active: ALWAYS
      distributionType: BINARY
      formats: [ TAR_GZ, ZIP ]
      attachPlatform: true
      exported: true
      applyDefaultMatrix: false
      rows:
#        - { os: linux,   arch: x64,   platform: linux-x86_64,    skipFormats: [ ZIP ] }
#        - { os: linux,   arch: arm64, platform: linux-aarch_64,  skipFormats: [ ZIP ] }
#        - { os: macos,   arch: x64,   platform: osx-x86_64,      skipFormats: [ ZIP ] }
        - { os: macos, arch: arm64, platform: osx-aarch_64, skipFormats: [ ZIP ] }

      fileSets:
        - input: artifacts/zjdk-{{platform}}
          includes: [ zjdk ]
          output: .

distributions:
  zjdk:
    type: BINARY
    executable:
      name: zjdk
    extraProperties:
      individualChecksum: true
    artifacts:
#      - path: artifacts/zjdk-linux-x64
#        platform: linux-x86_64
#      - path: artifacts/zjdk-linux-arm64
#        platform: linux-aarch_64
#      - path: artifacts/zjdk-macos-x64
#        platform: osx-x86_64
      - path: artifacts/zjdk-macos-arm64/zjdk
        platform: osx-aarch_64
        extraProperties:
          graalVMNativeImage: true

release:
  github:
    enabled: true
    draft: false
    skipTag: false
    overwrite: true
    changelog:
      formatted: ALWAYS
